<script>const BASE="https://dstkvlhjomuyoceijfft.supabase.co/rest/v1",KEY="sb_publishable_DkP-qII7LMS2C-FuBhPAeQ_tOeA_MiM",H={"apikey":KEY,"Authorization":"Bearer "+KEY};let trip,events=[],stays=[],cur="总览";const $=q=>document.querySelector(q),mins=t=>{let p=String(t||"00:00").slice(0,5).split(":");return +p[0]*60 + +p[1]},today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney"}).format(new Date()),map=q=>/^https?:\/\//i.test(q||"")?q:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q||"");
