  let html=`<div style="max-width:760px;margin:auto;padding:12px 12px 90px"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:20px">Australia 2026 · 云端</b><div style="font-size:12px;color:#748087">直接修改 Supabase 数据</div></div><button onclick="document.getElementById('tcCloudModal').remove()" style="border:0;border-radius:999px;padding:8px 11px">返回</button></div>`;
  for(const d of dates){
    html+=`<h3 style="margin:18px 2px 6px">${d.slice(5).replace("-","/")}</h3><div style="background:#fffefa;border:1px solid #e5ddd1;border-radius:16px;padding:8px 12px">`;
    for(const e of TC_EVENTS.filter(x=>x.event_date===d)){
      html+=`<div style="display:grid;grid-template-columns:50px 1fr auto;gap:8px;padding:11px 0;border-top:1px solid #eee7dd;opacity:${e.completed?.35:1}">
      <b>${String(e.event_time).slice(0,5)}</b><div><b>${e.title}</b><div style="font-size:12px;color:#748087">${e.place_name||""}${e.locked?" · 🔒":""}</div><div style="margin-top:7px"><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.place_name||e.title)}" style="font-size:12px;color:#176d87">🧭 导航</a>　<button onclick="tcEdit('${e.id}')" style="border:0;background:none;color:#176d87">编辑</button></div></div>
      <button onclick="tcComplete('${e.id}')" style="border:0;border-radius:999px;padding:6px 8px">${e.completed?"✓":"○"}</button></div>`;
    } html+="</div>";
  }
  html+=`</div>`;modal.innerHTML=html;document.body.appendChild(modal);
}

async function tcComplete(id){
  let e=TC_EVENTS.find(x=>x.id===id);if(!e)return;
  let r=await TC_SB.rpc("set_event_completed",{p_event:id,p_completed:!e.completed});
  if(r.error){alert(r.error.message);return}e.completed=!e.completed;tcShowCloud();
}
function tcEdit(id){
  let e=TC_EVENTS.find(x=>x.id===id);if(!e)return;
  let time=prompt("时间 HH:MM",String(e.event_time).slice(0,5));if(time===null)return;
  let title=prompt("行程",e.title);if(title===null)return;
  let place=prompt("地点（用于导航）",e.place_name||"");if(place===null)return;
  tcSaveEdit(e,time,title,place);
}
async function tcSaveEdit(e,time,title,place){
  let r=await TC_SB.from("events").update({event_time:time+":00",title,place_name:place}).eq("id",e.id).select().single();
  if(r.error){alert(r.error.message);return}Object.assign(e,r.data);tcShowCloud();
}
/* V7.1 replaces prior auto-init */
</script>

<script>

async function tc71Status(kind,msg){
 let el=document.getElementById("tc71");
 if(!el){el=document.createElement("div");el.id="tc71";el.style.cssText="max-width:760px;margin:8px auto;padding:10px 12px;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;font-size:13px";
 document.body.insertBefore(el,document.body.firstChild);}
 el.style.background=kind==="error"?"#fff0ed":kind==="ok"?"#eaf6ef":"#eef4f6";
 el.style.color=kind==="error"?"#8a2f24":"#234"; el.textContent=msg;
}
async function tc71Boot(){
 try{
   await tc71Status("info","☁ 正在连接 Trip Companion 云端…");

     "https://dstkvlhjomuyoceijfft.supabase.co",

   if(!cloudSB) throw new Error("Supabase SDK 未加载");
   window.tripSupabase = cloudSB;
   const {data:{session},error:se}=await cloudSB.auth.getSession();
   if(se) throw se;

   TC_USER=session.user;

   if(q.data && q.data.length){

   }
   let ev=await cloudSB.from("events").select("*").eq("trip_id",TC_TRIP.id).order("event_date").order("event_time");
   if(ev.error) throw new Error("读取 events 失败："+ev.error.message);

 }catch(err){

 }
}
window.tripSupabase?.auth?.onAuthStateChange(()=>setTimeout(tc71Boot,100));
