<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d4b"><title>Australia 2026</title>
<style>
:root{--bg:#f5f2eb;--card:#fffefa;--ink:#17232b;--muted:#748087;--line:#e5ddd1;--blue:#176d87;--navy:#173d4b;--gold:#d69a3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input{font:inherit}main{max-width:760px;margin:auto;padding:10px 11px 80px}.head{display:flex;justify-content:space-between;align-items:center;padding:7px 2px}.muted{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0;z-index:4}.tab,.btn{border:0;border-radius:999px;padding:8px 11px;font-weight:750}.tab{border:1px solid var(--line);background:var(--card);white-space:nowrap;color:#5b656c}.tab.on{background:var(--navy);color:#fff}.tab.past{opacity:.38}.now{background:linear-gradient(135deg,#173d4b,#18748c);color:white;border-radius:21px;padding:16px}.now h2{margin:4px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px;margin-top:9px}.hotel{border-left:4px solid var(--gold)}.event{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:12px 0;border-top:1px solid #eee7dd}.event:first-child{border-top:0}.event.done{opacity:.3}.event.over{background:#fff7e8;margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:10px}.event small{color:var(--muted)}.pill{border:0;border-radius:999px;padding:5px 7px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:var(--blue);color:white}.soft{background:#e9f1f3;color:#17596b}.weather{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:11px;background:#edf3f4;border-radius:999px;padding:5px 8px}.status{padding:8px 10px;border-radius:12px;background:#edf4f5;margin-bottom:8px;font-size:12px}.edit{color:#176d87;border:0;background:none;padding:0;font-size:12px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 11px;border-radius:10px;display:none}
</style></head><body><main><header class="head"><div><b>Australia 2026 <small>V8</small></b><div class="muted" id="mode">连接中…</div></div><button class="btn soft" id="login">Google 登录</button></header><div class="status" id="status">☁ 正在读取最新行程…</div><nav class="tabs" id="tabs"></nav><div id="view"></div></main><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://dstkvlhjomuyoceijfft.supabase.co","sb_publishable_DkP-qII7LMS2C-FuBhPAeQ_tOeA_MiM");
const hotels={"2026-09-26":"搭子悉尼住宿 · 待补充","2026-09-27":"TRYP by Wyndham Southport Gold Coast","2026-09-28":"TRYP by Wyndham Southport Gold Coast","2026-09-29":"TRYP by Wyndham Southport Gold Coast","2026-09-30":"TRYP by Wyndham Southport Gold Coast","2026-10-01":"悉尼住宿 · 待补充","2026-10-02":"悉尼住宿 · 待补充","2026-10-03":"悉尼住宿 · 待补充","2026-10-04":"今晚不住宿"};
let session=null,trip=null,events=[],cur="总览";const $=q=>document.querySelector(q);const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney"}).format(new Date());const nowm=()=>{let p=new Intl.DateTimeFormat("en-GB",{timeZone:"Australia/Sydney",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()).split(":");return +p[0]*60 + +p[1]};const mins=t=>{let p=String(t).slice(0,5).split(":");return +p[0]*60 + +p[1]};const map=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q||"");function toast(x){$("#toast").textContent=x;$("#toast").style.display="block";setTimeout(()=>$("#toast").style.display="none",1800)}
async function boot(){session=(await sb.auth.getSession()).data.session;$("#login").textContent=session?"退出":"Google 登录";$("#login").onclick=session?async()=>{await sb.auth.signOut();location.reload()}:()=>sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});$("#mode").textContent=session?(session.user.user_metadata?.full_name||session.user.email)+" · ☁ 管理模式":"👁 查看模式 · 无法编辑";let q=await sb.from("trips").select("*").eq("slug","australia-2026").limit(1);if(q.error)return fail(q.error);if(!q.data?.length)return fail(new Error("Australia 2026 尚未发布"));trip=q.data[0];await load();tabs();if(today()>="2026-09-26"&&today()<="2026-10-04")cur=today();render()}
async function load(){let q=await sb.from("events").select("*").eq("trip_id",trip.id).order("event_date").order("event_time");if(q.error)return fail(q.error);events=q.data||[];$("#status").textContent="☁ 最新行程 · "+events.length+" 项 · "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
function fail(e){$("#status").textContent="⚠ "+e.message;$("#status").style.background="#fff0ed"}
function tabs(){let ds=[...new Set(events.map(e=>e.event_date))],t=today();$("#tabs").innerHTML='<button class="tab" data-d="总览">总览</button>'+ds.map(d=>`<button class="tab ${d<t?'past':''}" data-d="${d}">${d.slice(5).replace("-","/")}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.d;render()})}
async function weather(date){let city=date>="2026-09-27"&&date<="2026-09-30"?"goldcoast":date==="2026-10-02"?"kiama":"sydney",p=city==="goldcoast"?[-28.0167,153.4]:city==="kiama"?[-34.6713,150.8565]:[-33.8688,151.2093];try{let j=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p[0]}&longitude=${p[1]}&current=temperature_2m,apparent_temperature,precipitation,wind_speed_10m&timezone=auto`).then(r=>r.json()),w=j.current;let el=$("#weather");if(el)el.innerHTML=`<span class="chip">🌡 ${w.temperature_2m}° · 体感${w.apparent_temperature}°</span><span class="chip">🌧 ${w.precipitation}mm</span><span class="chip">💨 ${w.wind_speed_10m}km/h</span><span class="chip">${w.apparent_temperature<18?"🧥 薄外套":w.precipitation>0?"☂️ 带雨具":"👕 轻装+防晒"}</span>`}catch(e){}}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.d===cur));if(cur==="总览"){ $("#view").innerHTML=`<div class="now"><small>${session?"管理模式":"分享查看"}</small><h2>Australia 2026</h2><p>${events.length} 个云端项目</p></div><div class="card"><span class="chip">☀️ 实时天气</span><span class="chip">🧭 Google Maps导航</span><span class="chip">🏨 酒店</span><span class="chip">🚋 交通信息随行程更新</span></div>`;return}let list=events.filter(e=>e.event_date===cur),n=cur===today()?nowm():-1,next=list.find(e=>!e.completed&&(cur!==today()||mins(e.event_time)>=n))||list.find(e=>!e.completed)||list.at(-1);let rows=list.map(e=>{let over=cur===today()&&!e.completed&&mins(e.event_time)<n;return `<div class="event ${e.completed?'done':''} ${over?'over':''}"><b>${String(e.event_time).slice(0,5)}</b><div><b>${e.title}</b><br><small>${e.place_name||""}${over?" · ⚠ 时间已过":e.locked?" · 🔒":""}</small><div>${e.place_name?`<a target="_blank" href="${map(e.place_name)}" style="font-size:12px;color:#176d87">🧭 导航</a>`:""}${session?`　<button class="edit" onclick="editEvent('${e.id}')">编辑</button>`:""}</div></div>${session?`<button class="pill" onclick="completeEvent('${e.id}')">${e.completed?"✓":"○"}</button>`:"<span></span>"}</div>`}).join("");$("#view").innerHTML=`<div class="now"><small>现在该干嘛</small><h2>${next?String(next.event_time).slice(0,5)+" · "+next.title:"今天完成"}</h2><div class="actions">${next?.place_name?`<a class="btn primary" target="_blank" href="${map(next.place_name)}">🧭 导航</a>`:""}</div></div><div class="card weather" id="weather">☀️ 更新天气中…</div><div class="card hotel"><small class="muted">🏨 今晚住哪</small><b style="display:block">${hotels[cur]||"待确认"}</b>${hotels[cur]&&hotels[cur]!=="今晚不住宿"?`<div class="actions"><a class="btn soft" target="_blank" href="${map(hotels[cur])}">酒店导航</a></div>`:""}</div><div class="card">${rows}</div>`;weather(cur)}
window.completeEvent=async id=>{if(!session)return;let e=events.find(x=>x.id===id),r=await sb.rpc("set_event_completed",{p_event:id,p_completed:!e.completed});if(r.error)return toast(r.error.message);e.completed=!e.completed;render()};
window.editEvent=async id=>{if(!session)return;let e=events.find(x=>x.id===id),time=prompt("时间",String(e.event_time).slice(0,5));if(time===null)return,title=prompt("行程",e.title);if(title===null)return,place=prompt("地点 / 导航",e.place_name||"");if(place===null)return;let r=await sb.from("events").update({event_time:time+":00",title,place_name:place}).eq("id",id).select().single();if(r.error)return toast(r.error.message);Object.assign(e,r.data);render();toast("已同步")};
sb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();setInterval(async()=>{if(trip){await load();render()}},120000);
</script></body></html>
