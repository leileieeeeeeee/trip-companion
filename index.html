<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d4b"><title>Australia 2026</title>
<style>
:root{--bg:#f5f2eb;--card:#fffefa;--ink:#17232b;--muted:#748087;--line:#e5ddd1;--blue:#176d87;--navy:#173d4b;--gold:#d69a3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button{font:inherit}main{max-width:760px;margin:auto;padding:10px 11px 80px}.head{display:flex;justify-content:space-between;align-items:center}.muted{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:var(--bg);padding:9px 0;z-index:3}.tab,.btn{border:0;border-radius:999px;padding:8px 11px;font-weight:750}.tab{background:var(--card);border:1px solid var(--line);white-space:nowrap}.tab.on{background:var(--navy);color:#fff}.now{background:linear-gradient(135deg,#173d4b,#18748c);color:#fff;border-radius:21px;padding:16px}.now h2{margin:4px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px;margin-top:9px}.hotel{border-left:4px solid var(--gold)}.event{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:12px 0;border-top:1px solid #eee7dd}.event:first-child{border-top:0}.event.done{opacity:.3}.event small{color:var(--muted)}.chip{font-size:11px;background:#edf3f4;border-radius:999px;padding:5px 8px;display:inline-block;margin:3px}.status{padding:9px 11px;background:#edf4f5;border-radius:12px;margin:8px 0;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:#fff;color:#17495a}.soft{background:#e9f1f3;color:#17596b}a{text-decoration:none}.error{background:#fff0ed;color:#8a2f24}
</style></head><body><main><header class="head"><div><b>Australia 2026 <small>V8.4</small></b><div class="muted">👁 分享查看 · 零外部 JS</div></div><div><button class="btn soft" id="loginBtn">Google 登录</button> <button class="btn soft" onclick="location.reload()">刷新</button></div></header><div class="status" id="status">☁ 正在读取最新行程…</div><nav class="tabs" id="tabs"></nav><div id="view"></div></main>
<script>
const BASE="https://dstkvlhjomuyoceijfft.supabase.co/rest/v1",KEY="sb_publishable_DkP-qII7LMS2C-FuBhPAeQ_tOeA_MiM";
let accessToken=localStorage.getItem("tc_access_token")||"";
const headers=()=>({"apikey":KEY,"Authorization":"Bearer "+(accessToken||KEY),"Content-Type":"application/json"});
const REDIRECT=location.origin+location.pathname;
function b64url(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function sha256(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s))}
async function login(){
 const verifier=b64url(crypto.getRandomValues(new Uint8Array(32)));localStorage.setItem("tc_pkce",verifier);
 const challenge=b64url(await sha256(verifier));
 location.href="https://dstkvlhjomuyoceijfft.supabase.co/auth/v1/authorize?provider=google&redirect_to="+encodeURIComponent(REDIRECT)+"&code_challenge="+encodeURIComponent(challenge)+"&code_challenge_method=s256";
}
async function exchangeCode(){
 const u=new URL(location.href),code=u.searchParams.get("code");if(!code)return;
 const verifier=localStorage.getItem("tc_pkce");if(!verifier)return;
 let r=await fetch("https://dstkvlhjomuyoceijfft.supabase.co/auth/v1/token?grant_type=pkce",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({auth_code:code,code_verifier:verifier})});
 if(!r.ok)throw new Error("登录换取令牌失败 · HTTP "+r.status);
 let j=await r.json();accessToken=j.access_token;localStorage.setItem("tc_access_token",accessToken);localStorage.setItem("tc_refresh_token",j.refresh_token||"");history.replaceState({},document.title,REDIRECT);
}
function logout(){localStorage.removeItem("tc_access_token");localStorage.removeItem("tc_refresh_token");accessToken="";location.reload()}
function parseJwt(t){try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))}catch(e){return null}}

const hotels={"2026-09-26":"搭子悉尼住宿 · 待补充","2026-09-27":"TRYP by Wyndham Southport Gold Coast","2026-09-28":"TRYP by Wyndham Southport Gold Coast","2026-09-29":"TRYP by Wyndham Southport Gold Coast","2026-09-30":"TRYP by Wyndham Southport Gold Coast","2026-10-01":"悉尼住宿 · 待补充","2026-10-02":"悉尼住宿 · 待补充","2026-10-03":"悉尼住宿 · 待补充","2026-10-04":"今晚不住宿"};
let trip,events=[],cur="总览";const $=q=>document.querySelector(q);const map=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q||"");const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney"}).format(new Date());const nowm=()=>{let p=new Intl.DateTimeFormat("en-GB",{timeZone:"Australia/Sydney",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()).split(":");return +p[0]*60 + +p[1]};const mins=t=>{let p=String(t).slice(0,5).split(":");return +p[0]*60 + +p[1]};
async function get(path){let c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{let r=await fetch(BASE+path,{headers:headers(),signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status+" · "+await r.text());return await r.json()}finally{clearTimeout(t)}}
async function boot(){try{
 await exchangeCode();
 const me=accessToken?parseJwt(accessToken):null;
 $("#loginBtn").textContent=accessToken?"退出":"Google 登录";
 $("#loginBtn").onclick=accessToken?logout:login;
 document.querySelector(".head .muted").textContent=accessToken?((me?.user_metadata?.full_name||me?.email||"已登录")+" · ☁ 管理模式"):"👁 分享查看 · 无法编辑";
 let ts=await get("/trips?slug=eq.australia-2026&select=id,name,public_read&limit=1");if(!ts.length)throw new Error("未找到公开 Australia 2026");trip=ts[0];events=await get("/events?trip_id=eq."+trip.id+"&select=id,event_date,event_time,title,place_name,locked,completed&order=event_date.asc,event_time.asc");$("#status").textContent="☁ 最新行程 · "+events.length+" 项 · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});tabs();if(today()>="2026-09-26"&&today()<="2026-10-04")cur=today();render()}catch(e){$("#status").classList.add("error");$("#status").textContent="⚠ 读取失败："+(e.name==="AbortError"?"连接超时":e.message)+" · 点击刷新重试";console.error(e)}}
function tabs(){let ds=[...new Set(events.map(e=>e.event_date))];$("#tabs").innerHTML='<button class="tab" data-d="总览">总览</button>'+ds.map(d=>`<button class="tab" data-d="${d}">${d.slice(5).replace("-","/")}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.d;render()})}
async function weather(date){let city=date>="2026-09-27"&&date<="2026-09-30"?"gc":date==="2026-10-02"?"kiama":"syd",p=city==="gc"?[-28.0167,153.4]:city==="kiama"?[-34.6713,150.8565]:[-33.8688,151.2093];try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p[0]}&longitude=${p[1]}&current=temperature_2m,apparent_temperature,precipitation,wind_speed_10m&timezone=auto`),j=await r.json(),w=j.current;$("#weather").innerHTML=`<span class="chip">🌡 ${w.temperature_2m}° · 体感${w.apparent_temperature}°</span><span class="chip">🌧 ${w.precipitation}mm</span><span class="chip">💨 ${w.wind_speed_10m}km/h</span><span class="chip">${w.apparent_temperature<18?"🧥 薄外套":w.precipitation>0?"☂️ 雨具":"👕 轻装+防晒"}</span>`}catch(e){$("#weather").textContent="天气暂不可用"}}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.d===cur));if(cur==="总览"){ $("#view").innerHTML=`<div class="now"><small>分享查看</small><h2>Australia 2026</h2><p>${events.length} 个云端项目</p></div><div class="card"><span class="chip">☀️ 天气</span><span class="chip">🧭 导航</span><span class="chip">🏨 酒店</span><span class="chip">🚋 行程交通</span></div>`;return}let list=events.filter(e=>e.event_date===cur),n=cur===today()?nowm():-1,next=list.find(e=>!e.completed&&(cur!==today()||mins(e.event_time)>=n))||list.find(e=>!e.completed)||list.at(-1);let rows=list.map(e=>`<div class="event ${e.completed?'done':''}"><b>${String(e.event_time).slice(0,5)}</b><div><b>${e.title}</b><br><small>${e.place_name||""}${e.locked?" · 🔒":""}</small>${e.place_name?`<div style="margin-top:5px"><a target="_blank" href="${map(e.place_name)}" style="font-size:12px;color:#176d87">🧭 导航</a>${accessToken?`　<button onclick="editEvent('${e.id}')" style="border:0;background:none;color:#176d87;padding:0">编辑</button>　<button onclick="completeEvent('${e.id}')" style="border:0;background:none;color:#176d87;padding:0">${e.completed?"取消完成":"完成"}</button>`:""}</div>`:""}</div></div>`).join("");$("#view").innerHTML=`<div class="now"><small>现在该干嘛</small><h2>${next?String(next.event_time).slice(0,5)+" · "+next.title:"今天完成"}</h2>${next?.place_name?`<div class="actions"><a class="btn primary" target="_blank" href="${map(next.place_name)}">🧭 导航</a></div>`:""}</div><div class="card" id="weather">☀️ 更新天气中…</div><div class="card hotel"><small class="muted">🏨 今晚住哪</small><b style="display:block">${hotels[cur]||"待确认"}</b>${hotels[cur]&&hotels[cur]!=="今晚不住宿"?`<div class="actions"><a class="btn soft" target="_blank" href="${map(hotels[cur])}">酒店导航</a></div>`:""}</div><div class="card">${rows}</div>`;weather(cur)}

window.editEvent=async id=>{if(!accessToken)return;let e=events.find(x=>x.id===id),time=prompt("时间",String(e.event_time).slice(0,5));if(time===null)return,title=prompt("行程",e.title);if(title===null)return,place=prompt("地点 / 导航",e.place_name||"");if(place===null)return;let r=await fetch(BASE+"/events?id=eq."+id,{method:"PATCH",headers:{...headers(),"Prefer":"return=representation"},body:JSON.stringify({event_time:time+":00",title,place_name:place})});if(!r.ok)return alert("保存失败 · HTTP "+r.status+" · "+await r.text());Object.assign(e,(await r.json())[0]);render()};
window.completeEvent=async id=>{if(!accessToken)return;let e=events.find(x=>x.id===id),r=await fetch(BASE+"/rpc/set_event_completed",{method:"POST",headers:headers(),body:JSON.stringify({p_event:id,p_completed:!e.completed})});if(!r.ok)return alert("更新失败 · HTTP "+r.status+" · "+await r.text());e.completed=!e.completed;render()};

boot();
</script></body></html>
