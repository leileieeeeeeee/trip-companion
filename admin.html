<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip 管理 V10.4</title>
<style>
body{margin:0;background:#f5f2eb;color:#17232b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:760px;margin:auto;padding:14px}.head{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:999px;padding:9px 12px;font-weight:700;background:#e8f1f3;color:#17596b;text-decoration:none}.primary{background:#176d87;color:white}.status,.card{background:#fffefa;border:1px solid #e5ddd1;border-radius:15px;padding:12px;margin-top:10px}.event{display:grid;grid-template-columns:55px 1fr auto;gap:8px;padding:11px 0;border-top:1px solid #eee7dd}.event:first-child{border-top:0}.muted{font-size:12px;color:#748087}.tabs{display:flex;gap:6px;overflow:auto;margin-top:10px}.tab{border:1px solid #e5ddd1;background:#fffefa;border-radius:999px;padding:8px 10px;white-space:nowrap}.tab.on{background:#173d4b;color:#fff}.error{background:#fff0ed;color:#8a2f24}

.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}.dialog{width:min(560px,100%);background:#fffefa;border-radius:20px;padding:16px;box-shadow:0 18px 60px #0003}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:#748087;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid #ddd4c7;border-radius:11px;padding:10px;font:inherit;background:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
</style></head><body><main>
<div class="head"><div><b>Australia 2026 · 管理 V10.4</b><div class="muted">本地 Supabase SDK</div></div><a class="btn" href="index.html">← 查看页</a></div>
<div class="status" id="status">后台已打开 · 可直接登录</div>
<div style="margin-top:10px"><button class="btn primary" id="loginBtn">Google 登录</button> <button class="btn" id="retryBtn">检查登录状态</button></div>
<div class="tabs" id="tabs"></div><div id="view"></div><div class="modal" id="editModal"><div class="dialog">
<b>编辑行程</b>
<div class="row"><div class="field"><label>时间</label><input id="fTime" type="time"></div><div class="field"><label>事件名称</label><input id="fTitle"></div></div>
<div class="field"><label>📍 导航地点名称</label><input id="fPlace" placeholder="例如 Sydney Fish Market"></div>
<div class="field"><label>Google Maps 链接 / 经纬度（可选，精确导航）</label><input id="fMap" placeholder="粘贴 Google Maps 链接，或 -33.8688,151.2093"></div>
<div class="field"><label>备注</label><textarea id="fNote" rows="3" placeholder="可选"></textarea></div>
<div class="actions"><button class="btn" id="mapSearch">Google Maps 搜索</button><button class="btn" id="testNav">测试导航</button><button class="btn" id="cancelEdit">取消</button><button class="btn primary" id="saveEdit">保存</button></div>
</div></div></main>
<script src="./supabase.js"></script>
<script>
const SUPABASE_URL="https://dstkvlhjomuyoceijfft.supabase.co", KEY="sb_publishable_DkP-qII7LMS2C-FuBhPAeQ_tOeA_MiM";
const REDIRECT="https://leileieeeeeeee.github.io/trip-companion/admin.html";
const $=q=>document.querySelector(q); let sb=null,trip=null,events=[],cur="";
function msg(x,bad=false){$("#status").textContent=x;$("#status").className="status"+(bad?" error":"")}
function ensure(){if(!window.supabase?.createClient){msg("⚠ 本地 supabase.js 未加载。确认它与 admin.html 在同一目录。",true);return false}if(!sb)sb=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});return true}
async function googleLogin(){
 try{
  if(!ensure())return;
  msg("正在打开 Google 登录…");
  const {data,error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:REDIRECT}});
  if(error)throw error;
  if(data?.url){ location.assign(data.url); return; }
 }catch(e){msg("⚠ 登录失败："+(e?.message||e),true)}
}
async function check(){
 try{
  if(!ensure())return;
  msg("正在检查登录状态…");
  const result=await Promise.race([
    sb.auth.getSession(),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error("检查登录状态超时")),6000))
  ]);
  if(result.error)throw result.error;
  const s=result.data.session;
  if(!s){msg("尚未登录 · 点击 Google 登录");return}
  $("#loginBtn").textContent="退出登录";
  $("#loginBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};
  msg((s.user.user_metadata?.full_name||s.user.email)+" · ☁ 管理模式");
  await load();
 }catch(e){msg("⚠ "+(e?.message||e)+"；登录按钮仍可直接使用",true)}
}
async function load(){
 let t=await sb.from("trips").select("*").eq("slug","australia-2026").single();
 if(t.error)throw t.error;trip=t.data;
 let r=await sb.from("events").select("*").eq("trip_id",trip.id).order("event_date").order("event_time");
 if(r.error)throw r.error;events=r.data;makeTabs()
}
function makeTabs(){let ds=[...new Set(events.map(e=>e.event_date))];cur=cur||ds[0];$("#tabs").innerHTML=ds.map(d=>`<button class="tab" data-d="${d}">${d.slice(5).replace("-","/")}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.d;render()});render()}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.d===cur));let a=events.filter(e=>e.event_date===cur);$("#view").innerHTML='<div class="card">'+a.map(e=>`<div class="event"><b>${String(e.event_time).slice(0,5)}</b><div><b>${e.title}</b><div class="muted">${e.place_name||""}</div></div><div><button class="btn" onclick="editE('${e.id}')">编辑</button> <button class="btn" onclick="doneE('${e.id}')">${e.completed?"取消完成":"完成"}</button></div></div>`).join("")+"</div>"}
let editingId=null;
function navTarget(){
 const m=$("#fMap").value.trim(), p=$("#fPlace").value.trim();
 return m||p;
}
window.editE=id=>{
 const e=events.find(x=>x.id===id); editingId=id;
 $("#fTime").value=String(e.event_time).slice(0,5);
 $("#fTitle").value=e.title||"";
 $("#fPlace").value=e.place_name||"";
 $("#fMap").value=e.map_url||"";
 $("#fNote").value=e.notes||"";
 $("#editModal").classList.add("on");
};
$("#cancelEdit").onclick=()=>$("#editModal").classList.remove("on");
$("#mapSearch").onclick=()=>window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent($("#fPlace").value.trim()),"_blank");
$("#testNav").onclick=()=>{let q=navTarget();if(q)window.open(/^https?:\/\//.test(q)?q:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")};
$("#saveEdit").onclick=async()=>{
 try{
  const e=events.find(x=>x.id===editingId);
  const payload={event_time:$("#fTime").value+":00",title:$("#fTitle").value.trim(),place_name:$("#fPlace").value.trim()};
  // Try richer fields if present in schema; fall back cleanly if not.
  let rich={...payload,map_url:$("#fMap").value.trim()||null,notes:$("#fNote").value.trim()||null};
  let r=await sb.from("events").update(rich).eq("id",editingId).select().single();
  if(r.error && /map_url|notes|column/i.test(r.error.message||"")) r=await sb.from("events").update(payload).eq("id",editingId).select().single();
  if(r.error)throw r.error;
  Object.assign(e,r.data); $("#editModal").classList.remove("on"); render(); msg("✓ 已同步修改");
 }catch(e){msg("⚠ "+e.message,true)}
}
window.doneE=async id=>{try{let e=events.find(x=>x.id===id),r=await sb.rpc("set_event_completed",{p_event:id,p_completed:!e.completed});if(r.error)throw r.error;e.completed=!e.completed;render();msg("✓ 完成状态已同步")}catch(e){msg("⚠ "+e.message,true)}}
$("#loginBtn").onclick=googleLogin; $("#retryBtn").onclick=check;
setTimeout(check,150);
</script></body></html>
