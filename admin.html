<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Companion 管理</title>
<style>
body{margin:0;background:#f5f2eb;color:#17232b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:760px;margin:auto;padding:14px}.head{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:999px;padding:9px 12px;font-weight:700;background:#e8f1f3;color:#17596b;text-decoration:none}.primary{background:#176d87;color:white}.card{background:#fffefa;border:1px solid #e5ddd1;border-radius:16px;padding:13px;margin-top:10px}.event{display:grid;grid-template-columns:55px 1fr auto;gap:8px;padding:11px 0;border-top:1px solid #eee7dd}.event:first-child{border-top:0}.muted{font-size:12px;color:#748087}.status{padding:9px 11px;border-radius:12px;background:#edf4f5;margin:10px 0}.error{background:#fff0ed;color:#8a2f24}.tabs{display:flex;gap:6px;overflow:auto}.tab{border:1px solid #e5ddd1;background:#fffefa;border-radius:999px;padding:8px 10px;white-space:nowrap}.tab.on{background:#173d4b;color:white}
</style></head><body><main><div class="head"><div><b>Australia 2026 · 管理后台 V8.5</b><div class="muted">仅主导人使用</div></div><a class="btn" href="index.html">← 返回查看页</a></div><div class="status" id="status">等待登录</div><div id="loginArea"><button class="btn primary" id="login">Google 登录</button></div><nav class="tabs" id="tabs"></nav><div id="view"></div></main>
<script>
const URL="https://dstkvlhjomuyoceijfft.supabase.co",BASE=URL+"/rest/v1",KEY="sb_publishable_DkP-qII7LMS2C-FuBhPAeQ_tOeA_MiM",REDIRECT=location.origin+location.pathname;
let token=localStorage.getItem("tc_admin_token")||"",trip=null,events=[],cur="";const $=q=>document.querySelector(q);
function b64(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}async function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s))}
async function login(){let v=b64(crypto.getRandomValues(new Uint8Array(32)));localStorage.setItem("tc_admin_pkce",v);let c=b64(await sha(v));location.href=URL+"/auth/v1/authorize?provider=google&redirect_to="+encodeURIComponent(REDIRECT)+"&code_challenge="+encodeURIComponent(c)+"&code_challenge_method=s256"}
async function exchange(){let u=new URL(location.href),code=u.searchParams.get("code");if(!code)return;let v=localStorage.getItem("tc_admin_pkce");let r=await fetch(URL+"/auth/v1/token?grant_type=pkce",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({auth_code:code,code_verifier:v})});if(!r.ok)throw new Error("OAuth token HTTP "+r.status+" · "+await r.text());let j=await r.json();token=j.access_token;localStorage.setItem("tc_admin_token",token);history.replaceState({},document.title,REDIRECT)}
const H=()=>({"apikey":KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json"});
async function req(path,opt={}){let r=await fetch(BASE+path,{...opt,headers:{...H(),...(opt.headers||{})}});if(!r.ok)throw new Error("HTTP "+r.status+" · "+await r.text());return r.status===204?null:r.json()}
function fail(e){$("#status").className="status error";$("#status").textContent="⚠ "+e.message;console.error(e)}
async function boot(){try{await exchange();if(!token){$("#login").onclick=login;return}$("#loginArea").innerHTML='<button class="btn" id="logout">退出登录</button>';$("#logout").onclick=()=>{localStorage.removeItem("tc_admin_token");location.reload()};$("#status").textContent="☁ 已登录 · 正在读取云端";let t=await req("/trips?slug=eq.australia-2026&select=id,name&limit=1");if(!t.length)throw new Error("找不到 Australia 2026");trip=t[0];events=await req("/events?trip_id=eq."+trip.id+"&select=*&order=event_date.asc,event_time.asc");$("#status").textContent="☁ 管理模式 · "+events.length+" 项";makeTabs()}catch(e){fail(e)}}
function makeTabs(){let ds=[...new Set(events.map(e=>e.event_date))];cur=ds[0];$("#tabs").innerHTML=ds.map(d=>`<button class="tab" data-d="${d}">${d.slice(5).replace("-","/")}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.d;render()});render()}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.d===cur));let list=events.filter(e=>e.event_date===cur);$("#view").innerHTML='<div class="card">'+list.map(e=>`<div class="event"><b>${String(e.event_time).slice(0,5)}</b><div><b>${e.title}</b><div class="muted">${e.place_name||""}${e.locked?" · 🔒":""}</div></div><div><button class="btn" onclick="editE('${e.id}')">编辑</button> <button class="btn" onclick="doneE('${e.id}')">${e.completed?"取消完成":"完成"}</button></div></div>`).join("")+"</div>"}
window.editE=async id=>{try{let e=events.find(x=>x.id===id),time=prompt("时间",String(e.event_time).slice(0,5));if(time===null)return,title=prompt("行程",e.title);if(title===null)return,place=prompt("地点 / 导航",e.place_name||"");if(place===null)return;let x=await req("/events?id=eq."+id,{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify({event_time:time+":00",title,place_name:place})});Object.assign(e,x[0]);render();$("#status").textContent="✓ 已同步修改"}catch(e){fail(e)}}
window.doneE=async id=>{try{let e=events.find(x=>x.id===id);await fetch(URL+"/rest/v1/rpc/set_event_completed",{method:"POST",headers:H(),body:JSON.stringify({p_event:id,p_completed:!e.completed})}).then(async r=>{if(!r.ok)throw new Error("HTTP "+r.status+" · "+await r.text())});e.completed=!e.completed;render();$("#status").textContent="✓ 完成状态已同步"}catch(e){fail(e)}}
boot();
</script></body></html>
